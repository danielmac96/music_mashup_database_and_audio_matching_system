services:
  app:
    build: .
    # `docker compose up` reuses an existing image by default, so a plain `up`
    # would keep serving the frontend bundle from whenever the image was last
    # built — the backend restarts, the UI does not change, and nothing says so.
    # `build` rebuilds on every `up`; the layer cache makes an unchanged tree
    # near-instant, and a touched frontend/ re-runs `npm run build`.
    pull_policy: build
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      MASHUP_PIPELINE_WORKERS: ${MASHUP_PIPELINE_WORKERS:-1}
      # Secrets come from a .env next to this file (template: .env.example),
      # which is gitignored and dockerignored. Empty = unset, so a blank entry
      # never overrides a key saved in the app's Settings.
      # 1001tracklists imports (Mixes tab) — or paste it when an import asks.
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      # Registered SoundCloud app for the dormant crate push / likes.
      SOUNDCLOUD_CLIENT_ID: ${SOUNDCLOUD_CLIENT_ID:-}
      SOUNDCLOUD_CLIENT_SECRET: ${SOUNDCLOUD_CLIENT_SECRET:-}
    restart: unless-stopped
